name: Offline tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: code_kit/requirements.txt
      - run: python -m pip install -r code_kit/requirements.txt
      - run: python -m pytest -q code_kit/tests code_kit/cobalt/tests
      - run: python -X utf8 tools/prepare_demo.py
