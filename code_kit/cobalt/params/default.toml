# Cobalt simulation parameters. Every tunable number lives here.
# Override order: this file -> --params <partial.toml> (deep merge, repeatable) -> --set a.b=value (repeatable).
# Unknown keys or wrong types stop the run. "VARSAYIM" = our assumption, not a dossier fact.

[run]
company = "cobalt"
company_name = "Cobalt Bank"
team = "team-NN"                     # set the real team number before packaging

[paths]                              # relative to the repo root
talp_db = "docs/talp_db"
outputs = "code_kit/cobalt/outputs"
personas_dir = "code_kit/cobalt/data/personas"
decisions_dir = "code_kit/cobalt/params/decisions"
announcements = "docs/talp_db/data/crises/announcements.json"
check_py = "talp-hackathon-participants/yeni-case-5-sirket/check.py"
client_memo = "docs/submission/CLIENT_MEMO.md"
team_doc = "docs/submission/TEAM_DOC.md"

[llm]
provider = "mock"                    # mock | gemini   (--live switches to gemini)
model = "experiment"                 # experiment | final | any explicit model id
model_experiment = "gemini-3.5-flash-lite"
model_final = "gemini-3.7-flash"
no_thinking_models = ["gemini-3.5-flash-lite", "gemini-3.1-flash-lite"]
thinking_level = "low"               # for models that cannot switch thinking off (KARARLAR K1)
temperature = 1.0
max_output_tokens = 2048
concurrency = 48                     # parallel calls per process
retries = 5                          # SDK HTTP retries
parse_retries = 2                    # re-ask when JSON does not parse
timeout_s = 180
cache = true

[personas]
persona_set = "latest"               # folder name under paths.personas_dir, or "latest"
sample_seed = 2026                   # seed for field sampling (fixed: personas are the same in every run)
story_model = "final"                # experiment | final | explicit id
story_seed = 7
max_rewrites = 2
similarity_max = 0.45                # word-trigram Jaccard above this -> rewrite (clones especially)
memory_words = 60
leader_share = 0.25                  # VARSAYIM: share of personas who lead opinions (vocal ones x1.6)

[budget]                             # API credit controls; lean_prompts = false restores the full prompts exactly
lean_prompts = true
history_full_weeks = 2               # round B: last N weekly notes verbatim; older weeks as one status line (notes are cumulative)
history_full_weeks_round_a = 1       # round A (react and talk) needs less history
compact_facts = true                 # same facts, short labels, one paragraph
relations_max = 4                    # "what people told you" lines kept
inbox_full_weeks = 1                 # a company message in full only in the week it arrives (check.py needs that week); later a short reminder
inbox_reminder_chars = 160           # reminder quotes the start of the message
brief_outputs = true                 # short free text in answers (output tokens cost most per token)
memory_words = 40                    # memory_note length when brief_outputs (else 60)
round_a_salient_only = true          # round A only after salient news/experiences or a Cobalt-related message from a friend

[network]
enabled_ties = true                  # direct messages / questions between personas
enabled_feed = true                  # public social posts visible to others
ties_min = 3
ties_max = 6
leader_extra_ties = 2
same_group_share = 0.6               # VARSAYIM: homophily
feed_size = 4                        # public posts shown per persona per round
dm_max = 2
graph_seed = 11

[turns]
round_a_skip_if_quiet = true         # round A only for personas with something new this week
max_replies = 2

[world]
surprises = true                     # false -> only surprise:false announcements (plan_nosurprises)
start_balance_note = true
# Migration overrun is drawn once per seed (common random numbers across plan/nodecision). VARSAYIM.
overrun_levels = ["on time", "a few hours late", "into Monday"]
overrun_probs = [0.45, 0.35, 0.20]
# Channel reach of a company message per week (VARSAYIM)
reach_push = 0.55
reach_email = 0.40
reach_in_app_daily = 0.85
reach_in_app_other = 0.35
reach_sms = 0.90
reach_ceo_video = 0.30
# Exposure to news of a surprise (VARSAYIM)
news_exposure_base = 0.35
news_exposure_per_source = 0.12
news_exposure_high_severity = 0.25
rival_campaign_weeks = [5, 6, 7]
rival_rate_gap = 0.5                 # rival offer, points above Cobalt (dossier: Cobalt is 0.5 below the top 3)
rival_exposure = 0.45
p2p_fail_prob = 0.8                  # P2P user tries to pay during the read-only window
big_purchase_prob = 0.35             # card payment above the offline cap during the window
holding_statement = true             # BAU: after any incident, holding statement on social within 24h

[support]
base_agents = 180                    # FACT
target_wait_min = 4.0                # FACT: normal wait
aht_min = 8.0                        # VARSAYIM: average handle time
on_duty_share = 0.35                 # VARSAYIM: share of support staff on duty in the busiest hours
base_contact_share = 0.04            # VARSAYIM: weekly share of active customers contacting support in a normal week
peak_hours = 4.0                     # VARSAYIM: hours of overload in a bad week (fluid approximation)
max_wait_min = 180.0
resolved_fast = 0.85                 # P(resolved) when wait < 15 min
resolved_mid = 0.6                   # wait < 60
resolved_slow = 0.4

[metrics]
out_kept = 0.0                       # VARSAYIM (metric_spec.json)
out_some = 0.3
out_most = 0.8
out_left = 0.95
exit_conversion = 0.69               # VARSAYIM: say-do; J.D. Power via Bankrate [KISMEN]: 13% say they may switch, 9% did (9/13). 1.0 = take personas literally
in_some = 0.10                       # VARSAYIM: added money as a share of balance
in_a_lot = 0.30
k_rating = 2.0                       # VARSAYIM, sensitivity 1-3
rating_base = 4.6                    # FACT
rating_window = [5, 10]              # weeks averaged for the end rating
cfpb_usual = 120                     # FACT, per month
complaints_usual = 1800              # FACT, per month
base_weeks = [1, 3]
rate_floor = 0.005
bootstrap_n = 1000
bootstrap_seed = 0

[metrics_v2]
enabled = true                       # write metrics_v2.json alongside unchanged v1 metrics.json
base_weeks = [1, 2]                  # week 3 already contains the card crisis
exclude_closed = false              # prior 28-day status is not erased by closing at the end
cfpb_calibration_validated = false   # do not claim a pass from an uncalibrated sparse proxy
cfpb_min_events = 20                 # operational threshold only, NOT proof of measurability
cfpb_min_base_events = 5
canonical_decisions = "w4t/w4t_T25_lock"

[sanity]                             # crisis_kb.json sanity_bounds
weekly_active_loss_max_pct = 1.0
total_active_loss_max_pct = 3.0
deposit_outflow_max_pct = 5.0

[optimize]                           # weekly planner (planner.py): surrogate screening, then LLM check
# utility per goal = weight x clip((value - target) / tol, -3, 1): meeting a target with a tol margin = full credit
w_goal_1 = 1.0                       # marketing: active customers
w_goal_2 = 1.5                       # CFO cares most about deposits (dossier)
w_goal_3 = 0.8                       # CRO: rating
w_goal_3b = 0.8                      # CRO: CFPB
tol_goal_1 = 1.0
tol_goal_2 = 1.5
tol_goal_3 = 0.1
tol_goal_3b = 60.0
w_cost_per_musd = 0.03               # tie-breaker: cheaper plan wins when goals are equal
targets = ["everyone", "paycheck customers", "savers with large balances", "small business owners with a Cobalt card reader", "students", "customers who live paycheck to paycheck"]
n_random_scenarios = 12              # future surprise mixes (bad and good) on top of "no further surprise"
max_future_surprises = 3
p_good = 0.3                         # VARSAYIM: share of future surprises that are good news
reps = 2                             # common-random-number replications per scenario
overrun_weights = [0.45, 0.35, 0.20] # used while week 6 has not happened (same as world.overrun_probs)
screen_scenarios = 5                 # stages A-B screen on this many scenarios, 1 rep
top_singletons_per_week = 6          # stage B: best distinct actions per week, combined 2-3 at a time
top_decisions = 40                   # stage C: pairs among these
time_budget_s = 300                  # surrogate search budget; the LLM check comes after
validate_top = 3                     # LLM runs (lite, 1 seed) of the best plans + no decision
scenario_seed = 99
